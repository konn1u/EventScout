<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | EventScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #1f2021 !important; color: white;">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EventScout</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    {% if current_user.is_authenticated %}
                        <span class="navbar-text me-3 text-white">
                            Привет,
                            <a href="/profile/{{ current_user.name }}" class="text-white text-decoration-none border-bottom border-primary border-2">
                                <strong>{{ current_user.name }}</strong>
                            </a>!
                        </span>
                        <a class="nav-link" href="/rating">Рейтинг</a> <a class="nav-link" href="/add_event">Создать событие</a>
                        <a class="btn btn-logout btn-sm ms-2" href="/logout">Выйти</a>
                    {% else %}
                        <a class="nav-link" href="/rating">Рейтинг</a> <a class="nav-link" href="/login">Войти</a>
                        <a class="btn btn-primary btn-sm ms-lg-2" href="/register">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
